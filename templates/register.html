{{template "base" .}}

{{define "title"}} — Inscription{{end}}

{{define "styles"}}
<link rel="stylesheet" href="/static/css/auth.css">
{{end}}

{{define "content"}}
<div class="auth-wrapper">
  <div class="auth-box">
    <div class="auth-logo">
      <div class="brand">grey<span>ddit</span></div>
      <p>Rejoins la communauté, c'est gratuit.</p>
    </div>
    {{if and .Data .Data.Error}}
      <div class="alert alert-error">{{.Data.Error}}</div>
    {{end}}
    <div class="card">
      <form method="POST" action="/register">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="toi@exemple.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="username">Nom d'utilisateur</label>
          <input type="text" id="username" name="username" placeholder="ex: lerenard42" required minlength="3" maxlength="30">
        </div>
        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" name="password" placeholder="Au moins 6 caractères" required minlength="6" autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary btn-full">Créer mon compte</button>
      </form>
    </div>
    <p class="auth-footer">Déjà un compte ? <a href="/login">Se connecter</a></p>
  </div>
</div>
{{end}}
