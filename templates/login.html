{{template "base" .}}

{{define "title"}} — Connexion{{end}}

{{define "styles"}}
<link rel="stylesheet" href="/static/css/auth.css">
{{end}}

{{define "content"}}
<div class="auth-wrapper">
  <div class="auth-box">
    <div class="auth-logo">
      <div class="brand">grey<span>ddit</span></div>
      <p>Bon retour parmi nous.</p>
    </div>
    {{if and .Data .Data.Error}}
      <div class="alert alert-error">{{.Data.Error}}</div>
    {{end}}
    <div class="card">
      <form method="POST" action="/login">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="toi@exemple.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-full">Se connecter</button>
      </form>
    </div>
    <p class="auth-footer">Pas encore de compte ? <a href="/register">S'inscrire</a></p>
  </div>
</div>
{{end}}
