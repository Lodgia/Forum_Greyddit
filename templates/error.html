{{template "base" .}}

{{define "title"}} — Erreur {{.Data.Code}}{{end}}

{{define "styles"}}
<link rel="stylesheet" href="/static/css/error.css">
{{end}}

{{define "content"}}
<div class="error-wrapper">
  <div class="error-box">
    <div class="error-code">{{.Data.Code}}</div>
    <h1 class="error-title">
      {{if eq .Data.Code 404}}Page introuvable
      {{else if eq .Data.Code 403}}Accès refusé
      {{else}}Erreur serveur{{end}}
    </h1>
    <p class="error-msg">{{.Data.Message}}</p>
    <a href="/" class="btn btn-primary">← Retour à l'accueil</a>
  </div>
</div>
{{end}}
