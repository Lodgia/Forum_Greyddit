<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Connexion – Greyddit</title>
        <link rel="stylesheet" href="/ui/static/css/login.css" />
    </head>
    <body>

        <div class="card">

           
            <div class="avatar">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
                </svg>
            </div>

            <h1>Connexion</h1>

            <div class="form-body">

                <div class="form-group">
                    <label for="userID">Identifiant</label>
                    <div class="input-wrapper">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                        <input type="text" id="userID" name="userID" placeholder="Votre identifiant" />
                    </div>
                </div>

                <div class="form-group">
                    <label for="pwd">Mot de passe</label>
                    <div class="input-wrapper">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                        <input type="password" id="pwd" name="pwd" placeholder="••••••••" />
                    </div>
                </div>

                <div class="forgot">
                    <a href="#">Mot de passe oublié ?</a>
                </div>

                <form method="POST" action="/login">
                    
                    <button class="btn-primary" type="submit">Se connecter</button>
                </form>

                <p class="form-footer">
                    Pas encore de compte ?
                    <a href="register.html">Créer un compte</a>
                </p>

            </div>
        </div>

    </body>
</html>
