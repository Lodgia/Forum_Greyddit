<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Inscription – Greyddit</title>
        <link rel="stylesheet" href="/LOGIN/CSS/login.css" />
        <link rel="stylesheet" href="/LOGIN/CSS/register.css" />
    </head>
    <body>
        <div class="page-wrapper">

            
            <div class="left-panel">
                <div class="brand-block">
                    <img class="brand-logo" src="/LOGIN/HTML/LOGIN/IMG/greyddit.jpg" alt="Greyddit Logo" width="50" height="50" />
                    <p class="brand-title">Greyddit</p>
                    <p class="brand-tagline">Rejoignez des milliers de membres et partagez vos idées.</p>
                </div>
            </div>

            
            <div class="right-panel">

                <div class="form-header">
                    <h1>Créer un compte</h1>
                    <p>Remplissez les informations ci-dessous pour vous inscrire.</p>
                </div>

                <div class="form-group">
                    <label for="username">Nom d'utilisateur</label>
                    <input type="text" id="username" name="username" placeholder="ex : john_doe" />
                </div>

                <div class="form-group">
                    <label for="email">Adresse e-mail</label>
                    <input type="email" id="email" name="email" placeholder="exemple@mail.com" />
                </div>

                <div class="form-group">
                    <label for="newpwd">Mot de passe</label>
                    <input type="password" id="newpwd" name="newpwd" placeholder="Minimum 8 caractères" />
                </div>

                <div class="form-group">
                    <label for="confirmpwd">Confirmer le mot de passe</label>
                    <input type="password" id="confirmpwd" name="confirmpwd" placeholder="Répétez votre mot de passe" />
                </div>

                <button class="btn-primary" type="submit">Créer mon compte</button>

                <p class="form-footer">
                    Déjà inscrit ?
                    <a href="login.html">Se connecter</a>
                </p>

            </div>
        </div>
    </body>
</html>
