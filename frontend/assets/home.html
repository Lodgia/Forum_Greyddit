<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Greyddit — Home</title>
  <link rel="stylesheet" href="/static/css/home.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1 class="logo">Greyddit</h1>
      <nav class="main-nav">
        <a href="/">Home</a>
        <a href="/register">Register</a>
        <a href="/post/create">Create Post</a>
        <a href="/login">Login</a>
      </nav>
    </div>
  </header>

  <main class="container main-grid">
    <section class="feed">
      <div class="card">
        <h2>Welcome to Greyddit</h2>
        <p>This is a starter homepage. Posts will appear here.</p>
      </div>
      <div id="posts" class="posts">
        <!-- Posts will be rendered here -->
      </div>
    </section>

    <aside class="sidebar">
      <div class="card">
        <h3>About</h3>
        <p>Minimal forum clone to iterate on.</p>
      </div>
      <div class="card">
        <h3>Categories</h3>
        <ul class="categories">
          <li>General</li>
          <li>Development</li>
          <li>Off-topic</li>
        </ul>
      </div>
    </aside>
  </main>

  <footer class="site-footer">
    <div class="container">© Greyddit</div>
  </footer>
  <script src="/static/assets/home.js" defer></script>
</body>
</html>
